<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			body {
				text-align: center;
				font-size: 50px;
			}

			.outterdiv {
				border: 5px orange dotted;
				padding: 25px;
				border-radius: 10px;
			}

			.middlediv {
				border: 2px purple dashed;
				padding: 25px;
				border-radius: 10px;
			}

			.innerdiv {
				border: 3px gray groove;
				padding: 50px;
				border-radius: 10px;
			}
		</style>
	</head>
	<body>
		<div class="outterdiv">
			<div class="middlediv">
				<div class="innerdiv">
					I'm a heavily packed &lt;div&gt;
				</div>
			</div>
		</div>
	</body>
</html>
